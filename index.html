<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solana Devnet SOL Quest</title>
    <meta name="description" content="Solana Devnet 上で実際に SOL を送金してクエストを達成するゲーム" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%97%8E%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/quest.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <span class="logo">◎</span>
          <h1>Solana SOL Quest</h1>
          <span class="badge devnet">DEVNET</span>
        </div>
        <div id="header-wallet"></div>
      </header>

      <div class="rpc-line" id="rpc-line"></div>
      <div id="network-error"></div>

      <section class="card center" id="connect-prompt" hidden>
        <h2>ウォレットを接続して冒険を始めよう</h2>
        <p class="muted">
          Phantom / Solflare / Backpack などのブラウザウォレットを接続してください。<br />
          ウォレット側のネットワークも Devnet に切り替えておくと、署名画面の表示が正確になります。
        </p>
        <button type="button" class="btn primary" data-action="open-wallet-modal">ウォレット接続</button>
      </section>

      <div id="connected" hidden>
        <div id="wallet-panel"></div>

        <nav class="mode-tabs">
          <button type="button" class="mode-tab" data-action="mode" data-mode="quest">🎮 クエスト</button>
          <button type="button" class="mode-tab" data-action="mode" data-mode="transfer">💸 自由送金</button>
        </nav>

        <div id="quest-view">
          <div id="quest-progress"></div>
          <div class="quest-toolbar" data-quest-toolbar>
            <button type="button" class="btn primary" data-action="add-quest">＋ クエストを追加</button>
            <button type="button" class="btn secondary" data-action="reset-progress">進行状況をリセット</button>
            <button type="button" class="btn secondary" data-action="restore-quests">初期クエストに戻す</button>
          </div>
          <div id="quest-error"></div>
          <div id="quest-list" class="quest-list"></div>
        </div>

        <div id="transfer-view" hidden></div>

        <div id="history"></div>
      </div>

      <footer class="footer muted">
        Devnet 専用アプリです。Devnet の SOL に金銭的価値はありません。
      </footer>
    </div>

    <div id="modal-root"></div>

    <!-- @solana/web3.js v1 のブラウザ向けビルド（グローバル変数 solanaWeb3 を公開） -->
    <script src="vendor/solana-web3.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
